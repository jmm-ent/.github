<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560">
<defs>
<linearGradient id="blue" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1200" y2="0" spreadMethod="reflect">
 <stop offset="0" stop-color="#60A5FA"/><stop offset=".45" stop-color="#2563EB"/><stop offset=".55" stop-color="#93C5FD"/><stop offset="1" stop-color="#2563EB"/>
 <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="2400 0" dur="7s" repeatCount="indefinite"/>
</linearGradient>
<linearGradient id="amber" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1200" y2="0" spreadMethod="reflect">
 <stop offset="0" stop-color="#FBBF24"/><stop offset=".45" stop-color="#FB923C"/><stop offset=".55" stop-color="#FDE68A"/><stop offset="1" stop-color="#F59E0B"/>
 <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="2400 0" dur="7s" repeatCount="indefinite"/>
</linearGradient>
<linearGradient id="blueS" x1="0" x2="1"><stop offset="0" stop-color="#60A5FA"/><stop offset="1" stop-color="#2563EB"/></linearGradient>
<linearGradient id="amberS" x1="0" x2="1"><stop offset="0" stop-color="#FBBF24"/><stop offset="1" stop-color="#F59E0B"/></linearGradient>
<filter id="blur" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="55"/></filter>
<filter id="blurS" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="35"/></filter>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity="0.035"/></pattern>
<clipPath id="cc0"><rect width="576" height="260" rx="22"/></clipPath><clipPath id="cc1"><rect width="576" height="260" rx="22"/></clipPath><clipPath id="cc2"><rect width="576" height="260" rx="22"/></clipPath><clipPath id="cc3"><rect width="576" height="260" rx="22"/></clipPath><clipPath id="clip"><rect width="1200" height="560" rx="24"/></clipPath></defs>
<style>
.f{font-family:'LINE Seed Sans','Inter','Segoe UI',Helvetica,Arial,sans-serif}
@keyframes reveal{0%{opacity:0;filter:blur(14px);transform:translateY(18px)}100%{opacity:1;filter:blur(0);transform:none}}
@keyframes driftA{0%{transform:translate(0,0) scale(1)}50%{transform:translate(-140px,60px) scale(1.15)}100%{transform:translate(40px,-30px) scale(.95)}}
@keyframes driftB{0%{transform:translate(0,0) scale(1)}50%{transform:translate(160px,-50px) scale(.9)}100%{transform:translate(-60px,30px) scale(1.1)}}
@keyframes driftC{0%{transform:translate(0,0)}100%{transform:translate(120px,-40px)}}
@keyframes breathe{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes ping{0%{transform:scale(1);opacity:.7}100%{transform:scale(3);opacity:0}}
@keyframes grow{0%{transform:scaleX(0)}100%{transform:scaleX(1)}}
.r{animation:reveal 1.1s cubic-bezier(.2,.7,.2,1) both}
.a{animation:driftA 14s ease-in-out infinite alternate}
.b{animation:driftB 17s ease-in-out infinite alternate}
.c{animation:driftC 11s ease-in-out infinite alternate}
.br{animation:breathe 5s ease-in-out infinite}
.blob{transform-box:fill-box;transform-origin:center}
.ping{transform-box:fill-box;transform-origin:center;animation:ping 2s ease-out infinite}
.grow{transform-box:fill-box;transform-origin:left center;animation:grow 1.2s cubic-bezier(.2,.7,.2,1) both}
</style>
<g transform="translate(0,0)"><g class="r" style="animation-delay:0.15s">
<g clip-path="url(#cc0)"><rect width="576" height="260" fill="#111115"/><g filter="url(#blurS)"><circle class="blob a" cx="486" cy="40" r="90" fill="#2563EB" opacity=".28" style="animation-duration:12s"/></g></g>
<rect x=".5" y=".5" width="575" height="259" rx="22" fill="none" stroke="#FFFFFF" stroke-opacity=".08"/>
<rect class="grow" style="animation-delay:0.44999999999999996s" x="36" y="0" width="90" height="3" fill="url(#blueS)"/>
<text x="36" y="52" class="f" font-size="13" font-weight="700" letter-spacing="3" fill="url(#blueS)">01 · TECH &amp; DEVOPS</text>
<text x="36" y="104" class="f" font-size="32" font-weight="900" letter-spacing="-1" fill="#FFFFFF">Custom software, end to end.</text>
<text x="36" y="150" class="f" font-size="19" fill="#FFFFFF" fill-opacity=".55">Booking engines, ERP/POS systems and</text>
<text x="36" y="178" class="f" font-size="19" fill="#FFFFFF" fill-opacity=".55">creator platforms for real businesses.</text>
<line x1="36" y1="208" x2="540" y2="208" stroke="#FFFFFF" stroke-opacity=".08"/>
<text x="36" y="236" class="f" font-size="12" font-weight="700" letter-spacing="2.5" fill="#FFFFFF" fill-opacity=".35">LOMPRAYAH · SITT TEXTILE · ICONNECT</text>
</g></g>
<g transform="translate(624,0)"><g class="r" style="animation-delay:0.32999999999999996s">
<g clip-path="url(#cc1)"><rect width="576" height="260" fill="#111115"/><g filter="url(#blurS)"><circle class="blob b" cx="486" cy="40" r="90" fill="#3B82F6" opacity=".28" style="animation-duration:15s"/></g></g>
<rect x=".5" y=".5" width="575" height="259" rx="22" fill="none" stroke="#FFFFFF" stroke-opacity=".08"/>
<rect class="grow" style="animation-delay:0.6299999999999999s" x="36" y="0" width="90" height="3" fill="url(#blueS)"/>
<text x="36" y="52" class="f" font-size="13" font-weight="700" letter-spacing="3" fill="url(#blueS)">02 · AI CANNY SYSTEM</text>
<text x="36" y="104" class="f" font-size="32" font-weight="900" letter-spacing="-1" fill="#FFFFFF">Our in-house AI layer.</text>
<text x="36" y="150" class="f" font-size="19" fill="#FFFFFF" fill-opacity=".55">Chains AI tools to automate back-office</text>
<text x="36" y="178" class="f" font-size="19" fill="#FFFFFF" fill-opacity=".55">work, and powers the AI in our sites.</text>
<line x1="36" y1="208" x2="540" y2="208" stroke="#FFFFFF" stroke-opacity=".08"/>
<text x="36" y="236" class="f" font-size="12" font-weight="700" letter-spacing="2.5" fill="#FFFFFF" fill-opacity=".35">AUTOMATION · AI FEATURES</text>
</g></g>
<g transform="translate(0,300)"><g class="r" style="animation-delay:0.51s">
<g clip-path="url(#cc2)"><rect width="576" height="260" fill="#111115"/><g filter="url(#blurS)"><circle class="blob c" cx="486" cy="40" r="90" fill="#F59E0B" opacity=".28" style="animation-duration:18s"/></g></g>
<rect x=".5" y=".5" width="575" height="259" rx="22" fill="none" stroke="#FFFFFF" stroke-opacity=".08"/>
<rect class="grow" style="animation-delay:0.81s" x="36" y="0" width="90" height="3" fill="url(#amberS)"/>
<text x="36" y="52" class="f" font-size="13" font-weight="700" letter-spacing="3" fill="url(#amberS)">03 · LIVE &amp; MEDIA</text>
<text x="36" y="104" class="f" font-size="32" font-weight="900" letter-spacing="-1" fill="#FFFFFF">Production at scale.</text>
<text x="36" y="150" class="f" font-size="19" fill="#FFFFFF" fill-opacity=".55">Multi-cam, multi-platform live streaming,</text>
<text x="36" y="178" class="f" font-size="19" fill="#FFFFFF" fill-opacity=".55">video, photo and short-form content.</text>
<line x1="36" y1="208" x2="540" y2="208" stroke="#FFFFFF" stroke-opacity=".08"/>
<text x="36" y="236" class="f" font-size="12" font-weight="700" letter-spacing="2.5" fill="#FFFFFF" fill-opacity=".35">LIVE COMMERCE · VIDEO · TIKTOK</text>
</g></g>
<g transform="translate(624,300)"><g class="r" style="animation-delay:0.6900000000000001s">
<g clip-path="url(#cc3)"><rect width="576" height="260" fill="#111115"/><g filter="url(#blurS)"><circle class="blob a" cx="486" cy="40" r="90" fill="#FB923C" opacity=".28" style="animation-duration:21s"/></g></g>
<rect x=".5" y=".5" width="575" height="259" rx="22" fill="none" stroke="#FFFFFF" stroke-opacity=".08"/>
<rect class="grow" style="animation-delay:0.99s" x="36" y="0" width="90" height="3" fill="url(#amberS)"/>
<text x="36" y="52" class="f" font-size="13" font-weight="700" letter-spacing="3" fill="url(#amberS)">04 · SONIC LABS</text>
<text x="36" y="104" class="f" font-size="32" font-weight="900" letter-spacing="-1" fill="#FFFFFF">Sound, built for short-form.</text>
<text x="36" y="150" class="f" font-size="19" fill="#FFFFFF" fill-opacity=".55">Jingles and tracks for TikTok, Reels and</text>
<text x="36" y="178" class="f" font-size="19" fill="#FFFFFF" fill-opacity=".55">Shorts. 8+ viral tracks and counting.</text>
<line x1="36" y1="208" x2="540" y2="208" stroke="#FFFFFF" stroke-opacity=".08"/>
<text x="36" y="236" class="f" font-size="12" font-weight="700" letter-spacing="2.5" fill="#FFFFFF" fill-opacity=".35">MUSIC · JINGLES · AUDIO</text>
</g></g>
</svg>
