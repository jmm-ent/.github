<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280">
<defs>
<linearGradient id="blue" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1200" y2="0" spreadMethod="reflect">
 <stop offset="0" stop-color="#60A5FA"/><stop offset=".45" stop-color="#2563EB"/><stop offset=".55" stop-color="#93C5FD"/><stop offset="1" stop-color="#2563EB"/>
 <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="2400 0" dur="7s" repeatCount="indefinite"/>
</linearGradient>
<linearGradient id="amber" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1200" y2="0" spreadMethod="reflect">
 <stop offset="0" stop-color="#FBBF24"/><stop offset=".45" stop-color="#FB923C"/><stop offset=".55" stop-color="#FDE68A"/><stop offset="1" stop-color="#F59E0B"/>
 <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="2400 0" dur="7s" repeatCount="indefinite"/>
</linearGradient>
<linearGradient id="blueS" x1="0" x2="1"><stop offset="0" stop-color="#60A5FA"/><stop offset="1" stop-color="#2563EB"/></linearGradient>
<linearGradient id="amberS" x1="0" x2="1"><stop offset="0" stop-color="#FBBF24"/><stop offset="1" stop-color="#F59E0B"/></linearGradient>
<filter id="blur" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="55"/></filter>
<filter id="blurS" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="35"/></filter>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity="0.035"/></pattern>
<clipPath id="clip"><rect width="1200" height="280" rx="24"/></clipPath></defs>
<style>
.f{font-family:'LINE Seed Sans','Inter','Segoe UI',Helvetica,Arial,sans-serif}
@keyframes reveal{0%{opacity:0;filter:blur(14px);transform:translateY(18px)}100%{opacity:1;filter:blur(0);transform:none}}
@keyframes driftA{0%{transform:translate(0,0) scale(1)}50%{transform:translate(-140px,60px) scale(1.15)}100%{transform:translate(40px,-30px) scale(.95)}}
@keyframes driftB{0%{transform:translate(0,0) scale(1)}50%{transform:translate(160px,-50px) scale(.9)}100%{transform:translate(-60px,30px) scale(1.1)}}
@keyframes driftC{0%{transform:translate(0,0)}100%{transform:translate(120px,-40px)}}
@keyframes breathe{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes ping{0%{transform:scale(1);opacity:.7}100%{transform:scale(3);opacity:0}}
@keyframes grow{0%{transform:scaleX(0)}100%{transform:scaleX(1)}}
.r{animation:reveal 1.1s cubic-bezier(.2,.7,.2,1) both}
.a{animation:driftA 14s ease-in-out infinite alternate}
.b{animation:driftB 17s ease-in-out infinite alternate}
.c{animation:driftC 11s ease-in-out infinite alternate}
.br{animation:breathe 5s ease-in-out infinite}
.blob{transform-box:fill-box;transform-origin:center}
.ping{transform-box:fill-box;transform-origin:center;animation:ping 2s ease-out infinite}
.grow{transform-box:fill-box;transform-origin:left center;animation:grow 1.2s cubic-bezier(.2,.7,.2,1) both}
</style>
<g clip-path="url(#clip)"><rect width="1200" height="280" fill="#09090B"/>
<g filter="url(#blur)">
 <ellipse class="br" cx="600" cy="300" rx="380" ry="120" fill="#F59E0B" opacity=".35"/>
 <circle class="blob a" cx="250" cy="60" r="110" fill="#2563EB" opacity=".25"/>
 <circle class="blob b" cx="980" cy="80" r="100" fill="#FB923C" opacity=".2"/>
</g></g>
<rect x=".5" y=".5" width="1199" height="279" rx="24" fill="none" stroke="#FFFFFF" stroke-opacity=".08"/>
<g text-anchor="middle">
 <text class="f r" style="animation-delay:0.2s" x="600" y="112" font-size="68" font-weight="900" letter-spacing="-2" fill="#FFFFFF">From One Room.</text>
 <text class="f r" style="animation-delay:0.5s" x="600" y="186" font-size="68" font-weight="900" letter-spacing="-2" fill="url(#amber)">To An Empire.</text>
 <text class="f r" style="animation-delay:0.85s" x="600" y="240" font-size="13" font-weight="700" letter-spacing="4" fill="#FFFFFF" fill-opacity=".35">JMM ENTERTAINMENT LTD. · BANGKOK, THAILAND</text>
</g>
</svg>
